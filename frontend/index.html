<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 默认值；运行时由 siteStore 用后台“网站设置”覆盖 -->
  <title>个人博客</title>
  <meta name="description" content="记录技术、生活与一路上的新发现。">
  <meta name="author" content="站长">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="/">

  <!-- 主题色：让移动端浏览器地址栏跟随站点主题 -->
  <meta name="theme-color" content="#165DFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!--
    首屏主题：在样式表生效前按本地主题设置给 <html> 加上 dark-mode，
    避免“系统深色 + 站内浅色”的读者先看到深色再翻白（或反向闪烁）。
    取值语义必须与 src/stores/theme.ts 保持一致（默认 light），
    存储键也与 src/constants 的 STORAGE_KEY_PREFIX 保持一致（有测试固定）。
  -->
  <script>
    ;(function () {
      try {
        var mode = localStorage.getItem('edu_theme') || 'light'
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark-mode')
      } catch (e) {}
    })()
  </script>

  <!--
    首屏站点外观：作者配置了页面背景图或非默认背景色时，/api/site/public 在首次绘制前
    一定拿不到，只能读上一次由 stores/site.ts 的 applyAppearance() 写进 localStorage
    的最终 CSS 值，否则页面会先画默认浅色再跳变到作者配置的外观。
    这里刻意做成「零逻辑转发」：只按白名单把字符串原样 setProperty 到 <html>，
    不拼接任何 CSS 取值——取值组合的唯一事实来源仍然是 applyAppearance()。
    #selfblog 由 Vue 挂载后才创建，<body> 里此刻只有 #app，
    所以只有 document.documentElement（即 :root）可写。
    存储键与 src/constants 的 STORAGE_KEY_PREFIX 保持一致（有测试固定）。
  -->
  <script>
    ;(function () {
      try {
        var raw = localStorage.getItem('edu_site_appearance')
        if (!raw) return
        var appearance = JSON.parse(raw)
        if (!appearance || typeof appearance !== 'object') return
        var allowed = [
          '--ap-bg-color',
          '--ap-bg-image',
          '--ap-bg-attachment',
          '--ap-bg-size',
          '--ap-bg-repeat'
        ]
        for (var i = 0; i < allowed.length; i++) {
          var value = appearance[allowed[i]]
          if (typeof value === 'string' && value) {
            document.documentElement.style.setProperty(allowed[i], value)
          }
        }
      } catch (e) {}
    })()
  </script>

  <!-- 订阅源自动发现：阅读器（Feedly / Inoreader / NetNewsWire 等）靠这三行找到订阅地址 -->
  <link rel="alternate" type="application/rss+xml" title="RSS 订阅" href="/feed.xml">
  <link rel="alternate" type="application/atom+xml" title="Atom 订阅" href="/atom.xml">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <!-- 分享到社交平台时的预览卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="个人博客">
  <meta property="og:title" content="个人博客">
  <meta property="og:description" content="记录技术、生活与一路上的新发现。">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="个人博客">
  <meta name="twitter:description" content="记录技术、生活与一路上的新发现。">

  <!--
    这里原先从 fonts.googleapis.com 加载 Fraunces + Plus Jakarta Sans，
    但整套 CSS 的 --font-display/--font-sans 从未引用这两个字体族，
    等于每次访问都白下载几百 KB 外部字体（且在国内网络下经常超时阻塞渲染）。
    已移除，字体改为在 variables.css 中用系统字体栈 + 中文回退。
  -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

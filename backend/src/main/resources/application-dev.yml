# ==================== 开发环境配置 ====================
# 激活方式：java -jar app.jar --spring.profiles.active=dev
# 或设置环境变量：spring_profiles_active=dev

spring:
  jackson:
    serialization:
      indent-output: true  # 格式化 JSON 输出，便于调试

  # 开发环境 H2 控制台（如果使用 H2 的话）
  # h2:
  #   console:
  #     enabled: true

# ==================== Actuator 开发环境配置 ====================
management:
  endpoint:
    health:
      show-details: always  # 开发环境显示完整健康详情

# ==================== 日志配置 ====================
logging:
  level:
    # 项目日志
    com.selfblog: DEBUG
    # Spring 框架日志
    org.springframework: DEBUG
    # SQL 日志（显示完整 SQL 语句）
    org.mybatis: DEBUG
    # 数据库连接池日志
    com.zaxxer.hikari: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
